<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<base target="_top">
<title>Quản lý nhân sự</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#16202E; --muted:#5B6878; --line:#D9DFE6;
  --brand:#1F4FD8; --brand-ink:#FFFFFF; --brand-soft:#E3EAFB;
  --ok:#157A4B; --ok-soft:#DDF3E8; --warn:#9A5B00; --warn-soft:#FBEBCB; --bad:#B42318; --bad-soft:#FBE0DD;
  --side:#14213D; --side-ink:#C9D3E6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#171E29; --ink:#E7ECF3; --muted:#93A0B3; --line:#283243;
    --brand:#6C8CFF; --brand-ink:#0B1020; --brand-soft:#1E2A4D;
    --ok:#5FD39B; --ok-soft:#14352A; --warn:#F2B654; --warn-soft:#3A2C10; --bad:#FF8A7E; --bad-soft:#41191A;
    --side:#0A0F18; --side-ink:#A9B6CC;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#171E29; --ink:#E7ECF3; --muted:#93A0B3; --line:#283243;
  --brand:#6C8CFF; --brand-ink:#0B1020; --brand-soft:#1E2A4D;
  --ok:#5FD39B; --ok-soft:#14352A; --warn:#F2B654; --warn-soft:#3A2C10; --bad:#FF8A7E; --bad-soft:#41191A;
  --side:#0A0F18; --side-ink:#A9B6CC;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* Đăng nhập */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-art{background:var(--side);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:flex-end}
.login-art h1{font-size:44px;line-height:1.1;margin:0 0 12px;font-weight:700}
.login-art p{margin:0;color:var(--side-ink);max-width:34ch;font-size:17px}
.login-card{display:grid;place-items:center;padding:32px}
.login-card form{width:min(380px,100%)}
.login-card h2{margin:0 0 4px;font-size:26px}
.login-card .sub{margin:0 0 22px}
.wide{width:100%;padding:11px 16px;margin-top:6px}
.loading,.fatal{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.fatal .panel{padding:28px;max-width:520px;text-align:left;color:var(--ink)}
.fatal code{background:var(--brand-soft);padding:1px 6px;border-radius:5px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:700;font-size:17px;color:#fff;padding:4px 10px 18px;letter-spacing:.2px}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--side-ink);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:var(--side-ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav .count{font-size:12px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.side .spacer{flex:1}
.who{padding:8px 10px;border-top:1px solid rgba(255,255,255,.12);margin-top:6px}
.who b{display:block;color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:12.5px}
.side .ghost{background:none;border:1px solid rgba(255,255,255,.2);color:var(--side-ink);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px}
.side .ghost:hover{background:rgba(255,255,255,.07)}

main{padding:28px 32px 48px;max-width:1180px;width:100%}
h1{font-size:24px;line-height:1.25;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 22px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar .grow{flex:1;min-width:180px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input[readonly]{background:var(--bg);color:var(--muted)}
textarea{resize:vertical;min-height:70px}
.toolbar select{width:auto;min-width:150px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--brand) 5%,transparent)}
.person{display:flex;gap:11px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none}
.person b{display:block;font-weight:600}
.person span{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--brand-soft);color:var(--brand)}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.note{padding:12px 16px;margin-bottom:14px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat .n{font-size:30px;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:13.5px;margin-top:4px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.card-h{padding:16px 18px 6px;font-weight:600}
.bars{padding:8px 18px 18px;display:flex;flex-direction:column;gap:12px}
.bar-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.track{height:10px;background:var(--brand-soft);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--brand);border-radius:99px}
.list{padding:4px 18px 16px;display:flex;flex-direction:column;gap:12px}
.list .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.list .row .muted{color:var(--muted);font-size:13px}

.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.dept{padding:18px}
.dept h3{margin:0 0 2px;font-size:17px}
.dept .muted{color:var(--muted);font-size:13.5px}
.dept .big{font-size:28px;font-weight:700;margin:10px 0 2px}
.dept .heads{display:flex;margin-top:10px}
.dept .heads .avatar{width:28px;height:28px;font-size:11px;margin-right:-6px;border:2px solid var(--surface)}

dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,25,.55)}
.dlg{padding:22px}
.dlg h2{margin:0 0 16px;font-size:19px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.err{color:var(--bad);font-size:13.5px;margin:10px 0;min-height:20px}

.busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--brand);transform-origin:left;animation:busy 1.1s ease-in-out infinite;z-index:60}
@keyframes busy{0%{transform:scaleX(.05)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:.2}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}

@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-art{padding:28px 24px;min-height:0}
  .login-art h1{font-size:32px}
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .logo{padding:0 8px 0 4px}.logo small{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}
  .side .spacer{display:none}
  .who{border-top:0;margin:0;padding:4px 8px}
  main{padding:20px 14px 40px}
  .two{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="busy" id="busy" hidden></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  "use strict";

  /* ===== CẤU HÌNH =====
     - Chạy ngay trong Apps Script (HtmlService): để trống API_URL.
     - Đặt trên website riêng (Netlify, Cloudflare Pages, GitHub Pages...): dán URL Web App
       (kết thúc bằng /exec) vào đây. */
  var API_URL = "";

  var GAS = (typeof google !== "undefined" && google.script && google.script.run) ? google.script.run : null;
  var TOKEN_KEY = "hr-token";
  var ROLE_LABEL = {admin:"Quản trị viên", hr:"Nhân sự", staff:"Nhân viên"};
  var ROLE_HINT = {admin:"Toàn quyền, quản lý tài khoản", hr:"Quản lý hồ sơ, phòng ban, duyệt phép", staff:"Xem danh bạ, tạo đơn nghỉ phép của mình"};
  var STATUS = ["Đang làm việc","Thử việc","Đã nghỉ việc"];
  var LEAVE_TYPES = ["Phép năm","Nghỉ ốm","Việc riêng","Nghỉ không lương"];
  var COLORS = ["#1F4FD8","#0E7C86","#7B3FC4","#C2410C","#157A4B","#A21C5B","#4B5563","#B45309"];

  var root = document.getElementById("root"), dlg = document.getElementById("dlg"), dlgBody = document.getElementById("dlgBody");
  var token = "", memToken = "", db = null, busy = false;
  var state = {view:"overview", q:"", fDept:"", fStatus:"", sort:"name"};

  /* ===== Tiện ích ===== */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function initials(n){ var p=n.trim().split(/\s+/); return ((p.length>1?p[p.length-2][0]:"")+p[p.length-1][0]).toUpperCase(); }
  function colorOf(n){ var h=0; for(var i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0; return COLORS[h%COLORS.length]; }
  function avatar(n){ return '<span class="avatar" style="background:'+colorOf(n)+'" aria-hidden="true">'+esc(initials(n||"?"))+'</span>'; }
  function fmtDate(d){ if(!d) return ""; var p=d.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function emp(id){ return db.emps.find(function(e){return e.id===id;}); }
  function statusBadge(s){ var c = s==="Đang làm việc"?"b-ok":s==="Thử việc"?"b-warn":"b-bad"; return '<span class="badge '+c+'">'+esc(s)+'</span>'; }
  function leaveBadge(s){ var c = s==="Đã duyệt"?"b-ok":s==="Từ chối"?"b-bad":"b-warn"; return '<span class="badge '+c+'">'+esc(s)+'</span>'; }
  function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(function(){t.classList.remove("show");},2800); }
  function opts(list,sel){ return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join(""); }
  function roleOpts(sel){ return Object.keys(ROLE_LABEL).map(function(r){return '<option value="'+r+'"'+(r===sel?' selected':'')+'>'+ROLE_LABEL[r]+' ('+esc(ROLE_HINT[r])+')</option>';}).join(""); }
  function activeEmps(){ return db.emps.filter(function(e){return e.status!=="Đã nghỉ việc";}); }
  function canEdit(){ return db.me.role!=="staff"; }
  function val(id){ return document.getElementById(id).value.trim(); }

  function getTok(){ try{ return localStorage.getItem(TOKEN_KEY)||memToken; }catch(e){ return memToken; } }
  function setTok(t){ memToken=t||""; token=memToken; try{ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }

  /* ===== Gọi máy chủ ===== */
  function rpc(action, data){
    var body = JSON.stringify({action:action, token:token, data:data||{}});
    if(GAS){
      return new Promise(function(res,rej){
        GAS.withSuccessHandler(function(t){ try{ res(JSON.parse(t)); }catch(e){ rej(e); } }).withFailureHandler(rej).rpc(body);
      });
    }
    return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body,redirect:"follow"})
      .then(function(r){ return r.json(); });
  }

  function setBusy(b){
    busy = b;
    document.getElementById("busy").hidden = !b;
    dlgBody.querySelectorAll("button").forEach(function(x){ x.disabled = b; });
  }
  function showErr(m){
    var e = document.getElementById("err");
    if(dlg.open && e) e.textContent = m; else toast(m);
  }
  function applyData(d){
    if(d.token){ setTok(d.token); delete d.token; }
    db = d; render();
  }

  /* Gửi một thao tác; thành công thì thay toàn bộ dữ liệu bằng bản mới từ máy chủ */
  function act(action, data, okMsg){
    if(busy) return Promise.resolve(null);
    setBusy(true);
    return rpc(action, data).then(function(r){
      setBusy(false);
      if(!r || !r.ok){
        if(r && r.code==="AUTH"){ forceLogin(r.error); return null; }
        showErr((r && r.error) || "Có lỗi xảy ra, thử lại sau.");
        return null;
      }
      applyData(r.data);
      if(okMsg) toast(okMsg);
      return r.data;
    }).catch(function(){
      setBusy(false);
      showErr("Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.");
      return null;
    });
  }

  /* ===== Đăng nhập / đăng xuất ===== */
  function forceLogin(msg){ setTok(""); showLogin(msg || "Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại."); }

  function showLogin(msg){
    db = null; closeDlg(); setBusy(false);
    root.innerHTML =
      '<div class="login"><div class="login-art"><h1>Nhân sự</h1><p>Hồ sơ nhân viên, phòng ban và nghỉ phép của công ty, gom về một nơi.</p></div>'+
      '<div class="login-card"><form id="lf" novalidate>'+
        '<h2>Đăng nhập</h2><p class="sub">Dùng tài khoản do quản trị viên cấp cho bạn.</p>'+
        '<label for="lg_email">Email</label><input id="lg_email" type="email" autocomplete="username" autocapitalize="off" spellcheck="false">'+
        '<label for="lg_pw" style="margin-top:12px">Mật khẩu</label><input id="lg_pw" type="password" autocomplete="current-password">'+
        '<div class="err" id="lg_err" role="alert">'+esc(msg||"")+'</div>'+
        '<button class="btn wide" id="lg_btn" type="submit">Đăng nhập</button>'+
      '</form></div></div>';
    var f = document.getElementById("lf");
    document.getElementById("lg_email").focus();
    f.addEventListener("submit", function(e){
      e.preventDefault();
      var email = document.getElementById("lg_email").value.trim(), pw = document.getElementById("lg_pw").value;
      var err = document.getElementById("lg_err"), btn = document.getElementById("lg_btn");
      if(!email || !pw){ err.textContent = "Nhập email và mật khẩu."; return; }
      err.textContent = ""; btn.disabled = true; btn.textContent = "Đang đăng nhập…";
      token = "";
      rpc("login",{email:email,password:pw}).then(function(r){
        if(r && r.ok){ state.view = r.data.me.role==="staff" ? "people" : "overview"; applyData(r.data); return; }
        err.textContent = (r && r.error) || "Không đăng nhập được.";
        btn.disabled = false; btn.textContent = "Đăng nhập"; document.getElementById("lg_pw").value = ""; document.getElementById("lg_pw").focus();
      }).catch(function(){
        err.textContent = "Không kết nối được máy chủ. Kiểm tra mạng, hoặc kiểm tra Web App đã triển khai cho “Bất kỳ ai” truy cập.";
        btn.disabled = false; btn.textContent = "Đăng nhập";
      });
    });
  }

  function logout(){ setTok(""); showLogin(); }

  /* ===== Điều hướng theo vai trò ===== */
  function navItems(){
    var r = db.me.role, items = [];
    if(r!=="staff") items.push(["overview","Tổng quan"]);
    items.push(["people","Nhân viên"]);
    if(r!=="staff") items.push(["depts","Phòng ban"]);
    items.push(["leave","Nghỉ phép"]);
    if(r==="admin") items.push(["users","Tài khoản"]);
    return items;
  }

  /* ===== Các màn hình ===== */
  function viewOverview(){
    var act = activeEmps();
    var pending = db.leaves.filter(function(l){return l.status==="Chờ duyệt";});
    var probation = db.emps.filter(function(e){return e.status==="Thử việc";}).length;
    var max = Math.max.apply(null, db.depts.map(function(d){return act.filter(function(e){return e.dept===d;}).length;}).concat([1]));
    var bars = db.depts.map(function(d){
      var n = act.filter(function(e){return e.dept===d;}).length;
      return '<div class="bar-row"><div class="top"><span>'+esc(d)+'</span><b>'+n+'</b></div><div class="track"><div class="fill" style="width:'+(n/max*100)+'%"></div></div></div>';
    }).join("");
    var recent = db.emps.slice().sort(function(a,b){return b.start.localeCompare(a.start);}).slice(0,5).map(function(e){
      return '<div class="row"><div class="person">'+avatar(e.name)+'<div><b>'+esc(e.name)+'</b><span>'+esc(e.title)+'</span></div></div><span class="muted">'+fmtDate(e.start)+'</span></div>';
    }).join("");
    return '<h1>Tổng quan</h1><p class="sub">Tình hình nhân sự hiện tại của công ty.</p>'+
      '<div class="stats">'+
        '<div class="panel stat"><div class="n">'+act.length+'</div><div class="l">Nhân viên đang làm</div></div>'+
        '<div class="panel stat"><div class="n">'+probation+'</div><div class="l">Đang thử việc</div></div>'+
        '<div class="panel stat"><div class="n">'+db.depts.length+'</div><div class="l">Phòng ban</div></div>'+
        '<div class="panel stat"><div class="n">'+pending.length+'</div><div class="l">Đơn nghỉ phép chờ duyệt</div></div>'+
      '</div>'+
      '<div class="two">'+
        '<div class="panel"><div class="card-h">Số nhân viên theo phòng ban</div><div class="bars">'+(bars||'<div class="empty">Chưa có phòng ban.</div>')+'</div></div>'+
        '<div class="panel"><div class="card-h">Nhân viên vào làm gần đây</div><div class="list">'+(recent||'<div class="empty">Chưa có nhân viên.</div>')+'</div></div>'+
      '</div>';
  }

  function filtered(){
    var q = state.q.trim().toLowerCase();
    var r = db.emps.filter(function(e){
      if(state.fDept && e.dept!==state.fDept) return false;
      if(state.fStatus && e.status!==state.fStatus) return false;
      if(q && (e.name+" "+e.email+" "+e.phone+" "+e.title).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    r.sort(function(a,b){
      if(state.sort==="start") return b.start.localeCompare(a.start);
      if(state.sort==="dept") return a.dept.localeCompare(b.dept,"vi");
      return a.name.split(" ").pop().localeCompare(b.name.split(" ").pop(),"vi");
    });
    return r;
  }

  function rowsPeople(){
    var r = filtered(), edit = canEdit();
    if(!r.length) return '<tr><td colspan="6"><div class="empty">Không tìm thấy nhân viên nào.'+(edit?' Thử đổi bộ lọc hoặc bấm “Thêm nhân viên”.':'')+'</div></td></tr>';
    return r.map(function(e){
      return '<tr><td><div class="person">'+avatar(e.name)+'<div><b>'+esc(e.name)+'</b><span>'+esc(e.email)+'</span></div></div></td>'+
        '<td>'+esc(e.title)+'</td><td>'+esc(e.dept)+'</td><td>'+statusBadge(e.status)+'</td><td>'+fmtDate(e.start)+'</td>'+
        '<td>'+(edit?'<div class="actions"><button class="btn sec sm" data-act="edit" data-id="'+e.id+'">Sửa</button><button class="btn sec sm" data-act="del" data-id="'+e.id+'">Xóa</button></div>':esc(e.phone))+'</td></tr>';
    }).join("");
  }

  function viewPeople(){
    var edit = canEdit();
    var dOpts = '<option value="">Tất cả phòng ban</option>'+db.depts.map(function(d){return '<option'+(state.fDept===d?' selected':'')+'>'+esc(d)+'</option>';}).join("");

      '<div class="toolbar">'+
        '<input class="grow" id="q" type="search" placeholder="Tìm theo tên, email, số điện thoại, chức danh" value="'+esc(state.q)+'" aria-label="Tìm nhân viên">'+
        '<select id="fDept" aria-label="Lọc phòng ban">'+dOpts+'</select>'+
        '<select id="fStatus" aria-label="Lọc trạng thái">'+sOpts+'</select>'+

      '<div class="panel tablewrap"><table><thead><tr><th>Họ và tên</th><th>Chức danh</th><th>Phòng ban</th><th>Trạng thái</th><th>Ngày vào làm</th><th>'+(edit?'':'Điện thoại')+'</th></tr></thead><tbody id="tbody">'+rowsPeople()+'</tbody></table></div>';
  }

  function viewDepts(){
    var cards = db.depts.map(function(d){
      var all = db.emps.filter(function(e){return e.dept===d;});
      var act = all.filter(function(e){return e.status!=="Đã nghỉ việc";});
      var heads = act.slice(0,5).map(function(e){return avatar(e.name);}).join("");
      return '<div class="panel dept"><h3>'+esc(d)+'</h3><div class="muted">'+all.length+' hồ sơ, gồm '+(all.length-act.length)+' đã nghỉ việc</div>'+
        '<div class="big">'+act.length+'</div><div class="muted">nhân viên đang làm</div>'+
        '<div class="heads">'+heads+'</div>'+
        '<div class="actions" style="margin-top:14px"><button class="btn sec sm" data-act="rendept" data-d="'+esc(d)+'">Đổi tên</button><button class="btn sec sm" data-act="deldept" data-d="'+esc(d)+'">Xóa</button></div></div>';
    }).join("");
    return '<h1>Phòng ban</h1><p class="sub">Cơ cấu tổ chức và quy mô từng phòng.</p>'+
      '<div class="toolbar"><button class="btn" data-act="adddept">Thêm phòng ban</button></div>'+
      '<div class="depts">'+(cards||'<div class="panel empty">Chưa có phòng ban nào. Bấm “Thêm phòng ban” để bắt đầu.</div>')+'</div>';
  }

  function viewLeave(){
    var mgr = canEdit();
    var ls = db.leaves.slice().sort(function(a,b){
      if(a.status==="Chờ duyệt" && b.status!=="Chờ duyệt") return -1;
      if(b.status==="Chờ duyệt" && a.status!=="Chờ duyệt") return 1;
      return b.from.localeCompare(a.from);
    });
    var rows = ls.map(function(l){
      var e = emp(l.empId), name = e? e.name : "(Đã xóa)";
      var buttons = "";
      if(mgr) buttons = l.status==="Chờ duyệt" ?
        '<button class="btn sm" data-act="approve" data-id="'+l.id+'">Duyệt</button><button class="btn sec sm" data-act="reject" data-id="'+l.id+'">Từ chối</button>' :
        '<button class="btn sec sm" data-act="dell" data-id="'+l.id+'">Xóa</button>';
      else if(l.status==="Chờ duyệt") buttons = '<button class="btn sec sm" data-act="dell" data-id="'+l.id+'">Hủy đơn</button>';
      var range = l.from===l.to ? fmtDate(l.from) : fmtDate(l.from)+" – "+fmtDate(l.to);
      return '<tr><td><div class="person">'+avatar(name)+'<div><b>'+esc(name)+'</b><span>'+esc(e?e.dept:"")+'</span></div></div></td>'+
        '<td>'+esc(l.type)+'</td><td>'+range+'</td><td>'+esc(l.reason)+'</td><td>'+leaveBadge(l.status)+'</td><td><div class="actions">'+buttons+'</div></td></tr>';
    }).join("");
    if(!rows) rows='<tr><td colspan="6"><div class="empty">Chưa có đơn nghỉ phép nào.</div></td></tr>';
    var unlinked = !mgr && db.me.empId==null;
    return '<h1>Nghỉ phép</h1><p class="sub">'+(mgr?'Tạo đơn và duyệt đơn nghỉ phép của nhân viên.':'Đơn nghỉ phép của bạn.')+'</p>'+
      (unlinked?'<div class="note">Email tài khoản của bạn chưa khớp với hồ sơ nhân viên nào, nên chưa tạo được đơn. Hãy nhờ bộ phận nhân sự cập nhật email trong hồ sơ.</div>':'')+
      '<div class="toolbar">'+(unlinked?'':'<button class="btn" data-act="addleave">Tạo đơn nghỉ phép</button>')+'</div>'+
      '<div class="panel tablewrap"><table><thead><tr><th>Nhân viên</th><th>Loại nghỉ</th><th>Thời gian</th><th>Lý do</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  function viewUsers(){
    var rows = db.users.map(function(u){
      var self = u.email===db.me.email;
      return '<tr><td><div class="person">'+avatar(u.name)+'<div><b>'+esc(u.name)+(self?' (bạn)':'')+'</b><span>'+esc(u.email)+'</span></div></div></td>'+
        '<td><span class="badge b-info">'+esc(ROLE_LABEL[u.role]||u.role)+'</span></td>'+
        '<td>'+(u.active?'<span class="badge b-ok">Đang hoạt động</span>':'<span class="badge b-bad">Đã khóa</span>')+'</td>'+
        '<td><div class="actions"><button class="btn sec sm" data-act="edituser" data-e="'+esc(u.email)+'">Sửa</button>'+
        '<button class="btn sec sm" data-act="pwuser" data-e="'+esc(u.email)+'">Đặt lại mật khẩu</button>'+
        (self?'':'<button class="btn sec sm" data-act="deluser" data-e="'+esc(u.email)+'">Xóa</button>')+'</div></td></tr>';
    }).join("");
    return '<h1>Tài khoản</h1><p class="sub">Ai được đăng nhập và được làm gì. Muốn nhân viên tự tạo đơn nghỉ phép, hãy dùng đúng email trong hồ sơ nhân viên của họ.</p>'+
      '<div class="toolbar"><button class="btn" data-act="adduser">Thêm tài khoản</button></div>'+
      '<div class="panel tablewrap"><table><thead><tr><th>Người dùng</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  /* ===== Vẽ giao diện ===== */
  function render(){
    if(!db) return;
    var items = navItems();
    if(!items.some(function(i){return i[0]===state.view;})) state.view = items[0][0];
    var pending = canEdit() ? db.leaves.filter(function(l){return l.status==="Chờ duyệt";}).length : 0;
    var nav = items.map(function(i){
      return '<button data-view="'+i[0]+'"'+(i[0]===state.view?' aria-current="page"':'')+'>'+i[1]+(i[0]==="leave"&&pending?' <span class="count">'+pending+'</span>':'')+'</button>';
    }).join("");
    var body = state.view==="overview"?viewOverview():state.view==="people"?viewPeople():state.view==="depts"?viewDepts():state.view==="leave"?viewLeave():viewUsers();
    root.innerHTML =
      '<div class="app"><aside class="side"><div class="logo">Nhân sự<small>Quản lý con người</small></div>'+
      '<nav class="nav">'+nav+'</nav><div class="spacer"></div>'+
      '<div class="who"><b>'+esc(db.me.name)+'</b><span>'+esc(ROLE_LABEL[db.me.role])+'</span></div>'+
      '<button class="ghost" data-act="chpw">Đổi mật khẩu</button><button class="ghost" data-act="logout">Đăng xuất</button></aside>'+
      '<main>'+body+'</main></div>';
    if(state.view==="people"){
      var tb = function(){ document.getElementById("tbody").innerHTML = rowsPeople(); };
      document.getElementById("q").addEventListener("input",function(e){ state.q=e.target.value; tb(); });
      document.getElementById("fDept").addEventListener("change",function(e){ state.fDept=e.target.value; tb(); });
      document.getElementById("fStatus").addEventListener("change",function(e){ state.fStatus=e.target.value; tb(); });
      document.getElementById("sort").addEventListener("change",function(e){ state.sort=e.target.value; tb(); });
    }
  }

  /* ===== Hộp thoại ===== */
  function openDlg(html){ dlgBody.innerHTML = html; if(!dlg.open) dlg.showModal(); var f = dlgBody.querySelector("input:not([readonly]),select,textarea"); if(f) f.focus(); }
  function closeDlg(){ if(dlg.open) dlg.close(); }
  function foot(okLabel, action, attrs, danger){
    return '<div class="foot"><button class="btn sec" data-act="close">Hủy</button><button class="btn'+(danger?' danger':'')+'" data-act="'+action+'" '+(attrs||"")+'>'+okLabel+'</button></div>';
  }
  function done(r){ if(r) closeDlg(); }

  function empForm(e){
    var isNew = !e; e = e || {name:"",email:"",phone:"",dept:db.depts[0]||"",title:"",status:"Đang làm việc",start:new Date().toISOString().slice(0,10)};
    openDlg('<h2>'+(isNew?'Thêm nhân viên':'Sửa hồ sơ')+'</h2><div class="grid">'+
      '<div class="full"><label for="f_name">Họ và tên</label><input id="f_name" value="'+esc(e.name)+'"></div>'+
      '<div><label for="f_email">Email</label><input id="f_email" type="email" value="'+esc(e.email)+'"></div>'+
      '<div><label for="f_phone">Số điện thoại</label><input id="f_phone" value="'+esc(e.phone)+'"></div>'+
      '<div><label for="f_dept">Phòng ban</label><select id="f_dept">'+opts(db.depts,e.dept)+'</select></div>'+
      '<div><label for="f_title">Chức danh</label><input id="f_title" value="'+esc(e.title)+'"></div>'+
      '<div><label for="f_status">Trạng thái</label><select id="f_status">'+opts(STATUS,e.status)+'</select></div>'+
      '<div><label for="f_start">Ngày vào làm</label><input id="f_start" type="date" value="'+esc(e.start)+'"></div>'+
      '</div><div class="err" id="err"></div>'+foot('Lưu','saveemp','data-id="'+(isNew?'':e.id)+'"'));
  }

  function leaveForm(){
    var mgr = canEdit(), today = new Date().toISOString().slice(0,10), who = "";
    if(mgr){
      var list = activeEmps();
      if(!list.length){ toast("Chưa có nhân viên đang làm để tạo đơn."); return; }
      who = '<div class="full"><label for="l_emp">Nhân viên</label><select id="l_emp">'+list.map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>';}).join("")+'</select></div>';
    }
    openDlg('<h2>Tạo đơn nghỉ phép</h2><div class="grid">'+who+
      '<div><label for="l_type">Loại nghỉ</label><select id="l_type">'+opts(LEAVE_TYPES)+'</select></div><div></div>'+
      '<div><label for="l_from">Từ ngày</label><input id="l_from" type="date" value="'+today+'"></div>'+
      '<div><label for="l_to">Đến ngày</label><input id="l_to" type="date" value="'+today+'"></div>'+
      '<div class="full"><label for="l_reason">Lý do</label><textarea id="l_reason" maxlength="500"></textarea></div>'+
      '</div><div class="err" id="err"></div>'+foot('Gửi đơn','saveleave'));
  }

  function nameForm(title, current, action, extra){
    openDlg('<h2>'+title+'</h2><label for="n_name">Tên phòng ban</label><input id="n_name" value="'+esc(current||"")+'"><div class="err" id="err"></div>'+foot('Lưu',action,'data-d="'+esc(extra||"")+'"'));
  }

  function confirmDlg(title, text, action, attrs, label){
    openDlg('<h2>'+title+'</h2><p style="margin:0;color:var(--muted)">'+text+'</p><div class="err" id="err"></div>'+foot(label||'Xác nhận xóa',action,attrs,true));
  }

  function userForm(u){
    var isNew = !u; u = u || {email:"",name:"",role:"staff",active:true};
    openDlg('<h2>'+(isNew?'Thêm tài khoản':'Sửa tài khoản')+'</h2><div class="grid">'+
      '<div class="full"><label for="u_email">Email đăng nhập</label><input id="u_email" type="email" value="'+esc(u.email)+'"'+(isNew?'':' readonly')+'></div>'+
      '<div class="full"><label for="u_name">Tên hiển thị</label><input id="u_name" value="'+esc(u.name)+'"></div>'+
      '<div class="full"><label for="u_role">Vai trò</label><select id="u_role">'+roleOpts(u.role)+'</select></div>'+
      (isNew?'<div class="full"><label for="u_pw">Mật khẩu ban đầu (ít nhất 8 ký tự)</label><input id="u_pw" type="password" autocomplete="new-password"></div>'
            :'<div class="full"><label for="u_active">Trạng thái</label><select id="u_active"><option value="1"'+(u.active?' selected':'')+'>Đang hoạt động</option><option value="0"'+(u.active?'':' selected')+'>Khóa tài khoản</option></select></div>')+
      '</div><div class="err" id="err"></div>'+foot('Lưu','saveuser','data-new="'+(isNew?1:0)+'"'));
  }

  function pwForm(title, fields, action, attrs){
    openDlg('<h2>'+title+'</h2><div class="grid">'+fields+'</div><div class="err" id="err"></div>'+foot('Đổi mật khẩu',action,attrs));
  }

  /* ===== Xử lý nút bấm ===== */
  function handle(b){
    var a = b.dataset.act, id = b.dataset.id, d = b.dataset.d, em = b.dataset.e;
    if(a==="close") return closeDlg();
    if(a==="logout") return logout();
    if(busy) return;

    if(a==="add") return empForm();
    if(a==="edit") return empForm(emp(+id));
    if(a==="saveemp"){
      var o = {id:id?+id:0,name:val("f_name"),email:val("f_email"),phone:val("f_phone"),dept:val("f_dept"),title:val("f_title"),status:val("f_status"),start:val("f_start")};
      if(!o.name) return showErr("Nhập họ và tên nhân viên.");
      if(!o.dept) return showErr("Hãy tạo phòng ban trước khi thêm nhân viên.");
      return act("emp.save",o,id?"Đã lưu hồ sơ":"Đã thêm nhân viên").then(done);
    }
    if(a==="del"){ var x=emp(+id); return confirmDlg("Xóa nhân viên","Hồ sơ của <b>"+esc(x.name)+"</b> và các đơn nghỉ phép liên quan sẽ bị xóa. Nếu chỉ nghỉ việc, hãy đổi trạng thái thành “Đã nghỉ việc”.","confirmdel",'data-id="'+id+'"'); }
    if(a==="confirmdel") return act("emp.delete",{id:+id},"Đã xóa nhân viên").then(done);

    if(a==="adddept") return nameForm("Thêm phòng ban","","savedept");
    if(a==="savedept") return act("dept.add",{name:val("n_name")},"Đã thêm phòng ban").then(done);
    if(a==="rendept") return nameForm("Đổi tên phòng ban",d,"saverendept",d);
    if(a==="saverendept") return act("dept.rename",{from:d,to:val("n_name")},"Đã đổi tên phòng ban").then(done);
    if(a==="deldept"){
      var cnt = db.emps.filter(function(x){return x.dept===d;}).length;
      if(cnt) return openDlg('<h2>Chưa thể xóa</h2><p style="margin:0;color:var(--muted)">Phòng <b>'+esc(d)+'</b> còn '+cnt+' hồ sơ nhân viên. Hãy chuyển họ sang phòng khác trước.</p><div class="foot"><button class="btn" data-act="close">Đã hiểu</button></div>');
      return confirmDlg("Xóa phòng ban","Xóa phòng <b>"+esc(d)+"</b>?","confirmdeldept",'data-d="'+esc(d)+'"');
    }
    if(a==="confirmdeldept") return act("dept.delete",{name:d},"Đã xóa phòng ban").then(done);

    if(a==="addleave") return leaveForm();
    if(a==="saveleave"){
      var l = {type:val("l_type"),from:val("l_from"),to:val("l_to"),reason:val("l_reason")};
      var sel = document.getElementById("l_emp"); if(sel) l.empId = +sel.value;
      if(!l.from||!l.to) return showErr("Chọn ngày bắt đầu và ngày kết thúc.");
      if(l.to<l.from) return showErr("Ngày kết thúc phải sau hoặc bằng ngày bắt đầu.");
      return act("leave.add",l,"Đã gửi đơn nghỉ phép").then(done);
    }
    if(a==="approve") return act("leave.review",{id:+id,status:"Đã duyệt"},"Đã duyệt đơn");
    if(a==="reject") return act("leave.review",{id:+id,status:"Từ chối"},"Đã từ chối đơn");
    if(a==="dell") return act("leave.delete",{id:+id},"Đã xóa đơn");

    if(a==="adduser") return userForm();
    if(a==="edituser") return userForm(db.users.find(function(u){return u.email===em;}));
    if(a==="saveuser"){
      var isNew = b.dataset.new==="1";
      var email = val("u_email"), name = val("u_name"), role = val("u_role");
      if(!name) return showErr("Nhập tên hiển thị.");
      if(isNew){
        var pw = document.getElementById("u_pw").value;
        if(pw.length<8) return showErr("Mật khẩu cần ít nhất 8 ký tự.");
        return act("user.create",{email:email,name:name,role:role,password:pw},"Đã thêm tài khoản").then(done);
      }
      return act("user.update",{email:email,name:name,role:role,active:val("u_active")==="1"},"Đã lưu tài khoản").then(done);
    }
    if(a==="pwuser") return pwForm("Đặt lại mật khẩu cho "+esc(em),
      '<div class="full"><label for="p_new">Mật khẩu mới (ít nhất 8 ký tự)</label><input id="p_new" type="password" autocomplete="new-password"></div>',"savepwuser",'data-e="'+esc(em)+'"');
    if(a==="savepwuser"){
      var np = document.getElementById("p_new").value;
      if(np.length<8) return showErr("Mật khẩu cần ít nhất 8 ký tự.");
      return act("user.resetPassword",{email:em,password:np},"Đã đặt lại mật khẩu").then(done);
    }
    if(a==="deluser") return confirmDlg("Xóa tài khoản","Xóa tài khoản <b>"+esc(em)+"</b>? Người này sẽ không đăng nhập được nữa (hồ sơ nhân viên vẫn giữ nguyên).","confirmdeluser",'data-e="'+esc(em)+'"');
    if(a==="confirmdeluser") return act("user.delete",{email:em},"Đã xóa tài khoản").then(done);

    if(a==="chpw") return pwForm("Đổi mật khẩu",
      '<div class="full"><label for="p_old">Mật khẩu hiện tại</label><input id="p_old" type="password" autocomplete="current-password"></div>'+
      '<div class="full"><label for="p_new">Mật khẩu mới (ít nhất 8 ký tự)</label><input id="p_new" type="password" autocomplete="new-password"></div>'+
      '<div class="full"><label for="p_new2">Nhập lại mật khẩu mới</label><input id="p_new2" type="password" autocomplete="new-password"></div>',"savechpw");
    if(a==="savechpw"){
      var o1 = document.getElementById("p_old").value, n1 = document.getElementById("p_new").value, n2 = document.getElementById("p_new2").value;
      if(!o1) return showErr("Nhập mật khẩu hiện tại.");
      if(n1.length<8) return showErr("Mật khẩu mới cần ít nhất 8 ký tự.");
      if(n1!==n2) return showErr("Hai lần nhập mật khẩu mới chưa giống nhau.");
      return act("password.change",{oldPassword:o1,newPassword:n1},"Đã đổi mật khẩu").then(done);
    }
  }

  document.addEventListener("click",function(e){
    if(e.target===dlg){ closeDlg(); return; }
    var v = e.target.closest("[data-view]");
    if(v){ state.view = v.dataset.view; render(); window.scrollTo(0,0); return; }
    var b = e.target.closest("[data-act]");
    if(b) handle(b);
  });
  dlg.addEventListener("keydown",function(e){
    if(e.key==="Enter" && e.target.tagName==="INPUT"){
      var ok = dlgBody.querySelector(".foot .btn:not(.sec)");
      if(ok){ e.preventDefault(); ok.click(); }
    }
  });

  /* ===== Khởi động ===== */
  function boot(){
    if(!GAS && !API_URL){
      root.innerHTML = '<div class="fatal"><div class="panel"><h2 style="margin-top:0">Chưa kết nối máy chủ</h2>'+
        '<p>Mở file <code>index.html</code>, tìm dòng <code>var API_URL = ""</code> và dán URL Web App (kết thúc bằng <code>/exec</code>) vào giữa hai dấu ngoặc kép.</p></div></div>';
      return;
    }
    token = getTok();
    if(!token){ showLogin(); return; }
    root.innerHTML = '<div class="loading">Đang tải dữ liệu…</div>';
    rpc("load").then(function(r){
      if(r && r.ok){ if(r.data.me.role==="staff") state.view="people"; applyData(r.data); }
      else showLogin(r && r.code==="AUTH" ? "Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại." : (r && r.error));
    }).catch(function(){
      root.innerHTML = '<div class="fatal"><div class="panel"><h2 style="margin-top:0">Không kết nối được máy chủ</h2>'+
        '<p>Kiểm tra mạng, và kiểm tra Web App đã triển khai với quyền truy cập “Bất kỳ ai”.</p><button class="btn" onclick="location.reload()">Thử lại</button></div></div>';
    });
  }
  boot();
})();
</script>
</body>
</html>
